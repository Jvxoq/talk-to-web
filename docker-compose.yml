# Development: the whole stack on one machine, with hot reload.
#
# Runs its own Postgres and Qdrant. Migrations run first, and the backend waits
# for its dependencies. Uses the Dockerfile.dev images, not `backend/Dockerfile`.
#
#   docker compose up --build

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # No curl or wget in the image, so bash opens a TCP socket.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talk_to_the_web
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `-U` and `-d`, or pg_isready checks a database that does not exist.
      test: ["CMD-SHELL", "pg_isready -U postgres -d talk_to_the_web"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # Creates the tables, as in production. Nothing else does.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Shared with `backend`, so the image builds once.
    image: talk-to-web-backend:dev
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/talk_to_the_web
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: talk-to-web-backend:dev
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/talk_to_the_web
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_uploads:/app/uploads
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # One-shot cleanup. Behind a profile, so `up` does not run it. Run it with:
  #
  #   docker compose --profile jobs run --rm cleanup-refresh-tokens
  cleanup-refresh-tokens:
    profiles: ["jobs"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: talk-to-web-backend:dev
    command: ["uv", "run", "python", "-m", "app.cleanup_expired_refresh_tokens"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/talk_to_the_web
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant_data:
  postgres_data:
  backend_venv:
  backend_uploads:
  frontend_node_modules:
