name: codeql

# Not path-filtered: a query pack update can flag unchanged code. The weekly
# schedule catches that too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesday, well clear of any weekday deploy window.
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # One job per language root.
        include:
          - language: python
            root: backend
          - language: javascript-typescript
            root: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ matrix.root }}

      # No build step: autobuild handles Python and TypeScript without compiling.
      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
