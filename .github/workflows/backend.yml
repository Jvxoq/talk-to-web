name: backend

# Path-filtered, so a skipped run reports no status. Do not mark these checks
# required until there is an always-running gate job.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # One job: the suite takes seconds, so parallel jobs would cost more in setup.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--locked` fails when uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        run: uv sync --all-groups --locked

      # Every step is scoped to `app tests`.
      - name: Format
        run: uv run ruff format --check app tests

      - name: Lint
        run: uv run ruff check app tests --output-format=github

      # Strict mypy proves the fakes in tests/fakes.py still match the ports.
      - name: Type check
        run: uv run mypy app tests

      # After the full sync, since lint-imports needs every dependency importable.
      - name: Architecture contracts
        run: uv run lint-imports

      # The coverage floor is in pyproject.toml, so laptop and CI agree.
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  # Its own job, since only it needs real Postgres and Qdrant. It covers what
  # fakes and SQLite cannot: timestamptz, unique violations, FK cascades, two
  # connections, payload indexes and the Alembic history.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The maintenance database used to create and drop scratch databases.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Service containers have no `depends_on`, so wait on this health check.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        # No curl or wget in the image, so bash opens a TCP socket.
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # `-m integration` replaces the default `-m "not integration"`. Its own
      # variables, not DATABASE_URL, since these tests drop databases. The skip
      # check fails the job if every test skipped. `pipefail` keeps pytest's exit code.
      - name: Integration tests
        env:
          INTEGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          INTEGRATION_QDRANT_URL: http://localhost:6333
        run: |
          set -o pipefail
          uv run pytest -m integration -rs | tee result.txt
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::integration tests skipped - services or env vars are missing"
            exit 1
          fi

  # Blocking, since the advisory list was empty when this was written, so red
  # means a new advisory. To mute one, use `--ignore-vuln <ID>`, or
  # `continue-on-error: true` on the job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Export runtime dependencies
        run: uv export --frozen --no-dev --no-hashes --format requirements-txt -o requirements-audit.txt

      # uv already pinned the full tree, so pip-audit need not re-resolve it.
      - name: Audit
        run: uvx pip-audit --no-deps --disable-pip --progress-spinner=off -r requirements-audit.txt
