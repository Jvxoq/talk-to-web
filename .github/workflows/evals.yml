# The only workflow that spends money and talks to a model provider, which is
# why it is its own file rather than a fourth job in `backend.yml`: it needs
# secrets none of those jobs need, and it fails for reasons none of them fail
# for.
#
# Two ways in:
#   pull_request  Runs `gate` mode, but only when the PR touches the agent (see
#                 `changes` below). A frontend or docs PR skips the paid job.
#   by hand       Pick a mode. Use `release` before the agent goes out, and
#                 after a model or prompt change.
# Either way, the paid job waits for a person to approve it. See `environment`
# on the `evals` job.
# Modes:
#   gate     1 trial per task, no judge. A failed task gets 2 more trials, and
#            the run fails if one of those fails too. About 2 cents.
#   release  10 trials per task, judges on. Fails if the suite misses more than
#            3% of trials or any task fails 3 times. About 35 cents.
#
# Mark the `evals` job required in branch protection, not this workflow. The
# workflow always starts on a PR, so it never sits "Pending". When the agent is
# untouched, `evals` is skipped by its `if`, and GitHub counts a job skipped by
# a conditional as a success. A `paths:` filter on the trigger would instead
# leave the required check pending forever and block the merge:
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate (1 trial per task) or release (10 trials per task)'
        type: choice
        options:
          - gate
          - release
        default: gate

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On a PR, a new push cancels the older run, even one waiting for approval.
  # Only the newest commit's result can satisfy the required check, so an older
  # run is money spent on an answer nobody reads. A manual start is never
  # cancelled: a second one waits rather than killing a paid release run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  # Does this PR touch the agent? Plain `git diff`, no third-party action.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The agent is the chat code, the adapters it calls (model, web tools,
      # vector store, embeddings), the wiring and settings that pick the model,
      # the eval harness and tasks, the locked library versions (a LangChain
      # bump can change answers), and this file. Markdown never counts.
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AGENT_PATHS: >-
            ^backend/app/(application/chat|domain/chat|adapters/(llm|web|vector|embedding))/|^backend/app/(composition|settings)\.py$|^backend/evals/|^backend/(pyproject\.toml|uv\.lock)$|^\.github/workflows/evals\.yml$
        run: |
          set -o pipefail
          agent_files=$(git diff --name-only "$BASE_SHA"...HEAD | { grep -v '\.md$' || true; } | { grep -E "$AGENT_PATHS" || true; })
          if [ -n "$agent_files" ]; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
            printf 'Agent files changed:\n%s\n' "$agent_files"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
            echo "No agent files changed. The eval job will be skipped."
          fi

  evals:
    needs: changes
    # Runs on a manual start (`changes` skipped), on a PR that touches the
    # agent, and when the diff step itself broke: a broken diff spends 2 cents
    # rather than waving the PR through. `!cancelled()` is needed because a
    # skipped `needs` job would otherwise skip this one too. A PR from a fork
    # gets no secrets, so it is skipped rather than failed on a missing key.
    # Run `release` by hand on that branch before merging it.
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.changes.result != 'success' || needs.changes.outputs.agent == 'true') }}
    # Approval before any money is spent. Coding agents open most PRs here, and
    # each push that touches the agent would otherwise start a paid run. The
    # `evals` environment has the repo owner as a required reviewer, so the job
    # waits until they click "Approve and deploy". While it waits, the required
    # check stays pending and the PR cannot merge. A manual start waits too, so
    # an agent with `gh` access cannot spend by starting the workflow itself.
    # Set up once in the repo settings, under Environments.
    environment: evals
    runs-on: ubuntu-latest
    # Room for a release run: 280 trials at concurrency 2.
    timeout-minutes: 60

    services:
      # `evals.harness._require_local_qdrant` refuses any non-local Qdrant, so
      # the free-tier cloud instance can never be filled by a run from here.
      # A service container published on localhost satisfies that check.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        # No curl, wget or shell utilities in the image, but bash can open a
        # TCP socket — the same trick `docker-compose.yml` and the integration
        # job use for this service.
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # `build_harness` constructs a `Settings()`, which requires every field
      # without a default — including several this run never uses. Checking the
      # two that matter here separately is what keeps a missing repository
      # secret from looking like a model regression.
      - name: Check secrets are present
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::LLM_API_KEY and GEMINI_API_KEY must be set as repository secrets"
            exit 1
          fi

      # `--tag ci` selects only the cases that are deterministic and offline.
      # The web tools run on saved pages (`--web recorded`, the default), so a
      # B2 task needs no internet and no Tavily key. Tasks that need live web
      # content are left untagged and run locally with `--web live`.
      # `tests/evals/test_datasets.py` is what stops the tag from
      # quietly disappearing and leaving a green job that ran nothing.
      #
      # `--mode` sets the trial count and the pass bar, so `--repeat` is not
      # passed. The exit code is 1 for a missed bar and 2 for a broken run.
      #
      # Concurrency 2, not 4: it keeps the run under the provider's rate limit,
      # and the harness only retries a 429 once per task.
      #
      # A PR has no `inputs`, so it falls back to `gate`.
      #
      # loguru writes to stderr, so stdout carries nothing but the markdown
      # report — which makes it safe to tee straight into the job summary.
      # `pipefail` keeps the CLI's exit code from being swallowed by the pipe.
      - name: Run eval suites
        env:
          QDRANT_URL: http://localhost:6333
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Required by `Settings`, unread by a `ci`-tagged case. A real value
          # would only widen what a compromised run could reach.
          DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
          TAVILY_API_KEY: unused
          DEEPGRAM_API_KEY: unused
          JWT_SECRET: unused
          MODE: ${{ inputs.mode || 'gate' }}
        run: |
          set -o pipefail
          uv run python -m evals \
            --suite all \
            --tag ci \
            --mode "$MODE" \
            --concurrency 2 \
            --out evals/results/ci.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/ci.json
          if-no-files-found: warn
