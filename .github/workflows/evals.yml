# The only workflow that spends money and talks to a model provider, which is
# why it is its own file rather than a fourth job in `backend.yml`: it needs
# secrets none of those jobs need, and it fails for reasons none of them fail
# for.
#
# Started by hand only. There is no `pull_request` trigger: a run costs money
# and a model's answers vary, so a person decides when it is worth running.
# Pick a mode when you start it:
#   gate     1 trial per task, no judge. A failed task gets 2 more trials, and
#            the run fails if one of those fails too. Cheap. Run it before merge.
#   release  10 trials per task, judges on. Fails if the suite misses more than
#            3% of trials or any task fails 3 times. Run it before the agent
#            goes out, and after a model or prompt change.
# Because nothing runs on its own, this must not be marked required in branch
# protection.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate (1 trial per task) or release (10 trials per task)'
        type: choice
        options:
          - gate
          - release
        default: gate

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel: a second manual start must wait, not kill a paid run.
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  evals:
    runs-on: ubuntu-latest
    # Room for a release run: 280 trials at concurrency 2.
    timeout-minutes: 60

    services:
      # `evals.harness._require_local_qdrant` refuses any non-local Qdrant, so
      # the free-tier cloud instance can never be filled by a run from here.
      # A service container published on localhost satisfies that check.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        # No curl, wget or shell utilities in the image, but bash can open a
        # TCP socket — the same trick `docker-compose.yml` and the integration
        # job use for this service.
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # `build_harness` constructs a `Settings()`, which requires every field
      # without a default — including several this run never uses. Checking the
      # two that matter here separately is what keeps a missing repository
      # secret from looking like a model regression.
      - name: Check secrets are present
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::LLM_API_KEY and GEMINI_API_KEY must be set as repository secrets"
            exit 1
          fi

      # `--tag ci` selects only the cases that are deterministic and offline.
      # The web tools run on saved pages (`--web recorded`, the default), so a
      # B2 task needs no internet and no Tavily key. Tasks that need live web
      # content are left untagged and run locally with `--web live`.
      # `tests/evals/test_datasets.py` is what stops the tag from
      # quietly disappearing and leaving a green job that ran nothing.
      #
      # `--mode` sets the trial count and the pass bar, so `--repeat` is not
      # passed. The exit code is 1 for a missed bar and 2 for a broken run.
      #
      # Concurrency 2, not 4: Groq's free tier throttles, and the harness only
      # retries a 429 once per case.
      #
      # loguru writes to stderr, so stdout carries nothing but the markdown
      # report — which makes it safe to tee straight into the job summary.
      # `pipefail` keeps the CLI's exit code from being swallowed by the pipe.
      - name: Run eval suites
        env:
          QDRANT_URL: http://localhost:6333
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Required by `Settings`, unread by a `ci`-tagged case. A real value
          # would only widen what a compromised run could reach.
          DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
          TAVILY_API_KEY: unused
          DEEPGRAM_API_KEY: unused
          JWT_SECRET: unused
        run: |
          set -o pipefail
          uv run python -m evals \
            --suite all \
            --tag ci \
            --mode "${{ inputs.mode }}" \
            --concurrency 2 \
            --out evals/results/ci.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/ci.json
          if-no-files-found: warn
