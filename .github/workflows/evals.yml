name: evals

# The only workflow that spends money on a model provider, so it is its own
# file with its own secrets. It runs only on prompt, model, tool or guardrail
# changes. Path-filtered, so do not mark it required.
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/application/chat/**'
      - 'backend/app/settings.py'
      - 'backend/evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  evals:
    # Fork PRs get no secrets, so the run would fail for the wrong reason.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The harness refuses non-local Qdrant, so this service container is used.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        # No curl or wget in the image, so bash opens a TCP socket.
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # `Settings()` needs every required field. Check the two that matter here, so
      # a missing secret does not look like a model regression.
      - name: Check secrets are present
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::LLM_API_KEY and GEMINI_API_KEY must be set as repository secrets"
            exit 1
          fi

      # `--tag ci` selects only offline, deterministic cases.
      # `tests/evals/test_datasets.py` makes sure the tag still selects something.
      # Concurrency 2, since the provider's free tier throttles. Logs go to stderr,
      # so stdout is just the report. `pipefail` keeps the exit code.
      - name: Run eval suites
        env:
          QDRANT_URL: http://localhost:6333
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Required by `Settings`, unused by `ci` cases. Dummy values on purpose.
          DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
          TAVILY_API_KEY: unused
          DEEPGRAM_API_KEY: unused
          JWT_SECRET: unused
        run: |
          set -o pipefail
          uv run python -m evals \
            --suite all \
            --tag ci \
            --concurrency 2 \
            --out evals/results/ci.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/ci.json
          if-no-files-found: warn
