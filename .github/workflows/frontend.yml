name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Node 22 LTS. Vite 8 requires 20.19+/22.12+, so 20.x only just clears the
      # bar; .nvmrc pins the same version locally.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` already fails on a package-lock.json that disagrees with
      # package.json, so there is no separate lockfile gate to add.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Explicit rather than left to the build, so a type error is reported as a
      # type error. `build` runs the same `tsc -b` afterwards; the second run is
      # a no-op against the .tsbuildinfo this one just wrote.
      - name: Typecheck
        run: npm run typecheck

      # Vitest, node environment, no infrastructure. Tests live next to the unit
      # they cover as `*.test.ts`.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Blocking - see the note in backend.yml. `npm audit fix` cleared the two high
  # findings (nanoid, postcss, both transitive under vite) when this pipeline was
  # written, so anything red here is new. `--audit-level=high` deliberately lets
  # low/moderate findings through: the dev-dependency tail of a Vite toolchain
  # produces a steady trickle of those, and failing on them trains people to
  # ignore the job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
