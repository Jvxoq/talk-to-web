name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Node 22 LTS. Vite 8 needs 20.19+ or 22.12+. .nvmrc pins the same version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` already fails on a lockfile mismatch.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Run separately so a type error reads as one. `build` reuses the result.
      - name: Typecheck
        run: npm run typecheck

      # Vitest, node environment, no infrastructure.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Blocking: the audit was clean when this was written, so red means new.
  # `--audit-level=high` lets the steady low/moderate dev-tool findings through.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
