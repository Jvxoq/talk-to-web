# Production: the backend half of the deployment, and nothing else.
#
#   frontend  -> Vercel (static build, see frontend/vercel.json)
#   backend   -> here, on EC2, behind Caddy
#   Postgres  -> Neon
#   Qdrant    -> Qdrant Cloud
#
# So there is no postgres service, no qdrant service and no frontend service in
# the default run - all three are somebody else's uptime now. What is left is
# TLS, one migration step, and the application.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Two env files feed it: `./.env` carries the two deployment variables compose
# interpolates below (see `.env.example`), and `./backend/.env.production`
# carries the application's secrets, which are never interpolated here and never
# baked into the image - they are read by the container at start.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys live here. Losing this volume means
      # re-issuing on every deploy, which is how a deployment walks into Let's
      # Encrypt's rate limit and ends up with no certificate at all.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Schema, as its own step that has to succeed before anything serves traffic.
  # The application no longer creates tables at startup in any environment, so
  # this is the only thing that does.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Named so `backend` below can reuse the image instead of building it twice.
    image: talk-to-the-web-backend:latest
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
    # A migration runs once and exits. Restarting it on exit 0 would loop
    # forever; restarting it on failure would retry a broken migration against a
    # half-migrated database.
    restart: "no"

  backend:
    image: talk-to-the-web-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      # Set here rather than left to the env file, because forgetting it is not
      # a visible failure: `ENVIRONMENT` defaults to "local", and the difference
      # between local and production is JSON logging and every other decision
      # keyed off the environment name. A value this consequential should not be
      # one missing line in an untracked file.
      ENVIRONMENT: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Deliberately no `ports:`. The application is reachable only through Caddy,
    # on the compose network - publishing 8000 would put an untrusted, plaintext
    # copy of the API on the host's public interface, next to the TLS one.
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Longer than the default 10s: a reply being streamed to a browser is a live
    # request, and killing the process mid-stream truncates somebody's answer.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot housekeeping, same shape as `migrate` - it runs, it exits, and
  # nothing depends on it. Not started by `docker compose up`; it has its own
  # profile so a routine deploy never runs it on its own. On EC2 this is what a
  # host crontab entry invokes:
  #
  #   docker compose -f docker-compose.prod.yml --profile jobs \
  #     run --rm cleanup-refresh-tokens
  cleanup-refresh-tokens:
    profiles: ["jobs"]
    image: talk-to-the-web-backend:latest
    command: ["python", "-m", "app.cleanup_expired_refresh_tokens"]
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
    restart: "no"

  # Parity only - not part of a real deployment, where Vercel serves this.
  #
  #   docker compose -f docker-compose.prod.yml --profile parity up --build
  #
  # It exists so the *built* frontend and `nginx.conf` can be exercised against
  # the production backend image before any of it reaches AWS. Reachable on
  # :8080 because Caddy already has 80 and 443.
  frontend:
    profiles: ["parity"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  backend_uploads:
