# Render Blueprint: the backend half of the deployment only.
#
#   frontend  -> Vercel
#   backend   -> here, on Render
#   Postgres  -> Neon
#   Qdrant    -> Qdrant Cloud
#
# Three things from the old EC2 setup are gone:
#
#   1. Caddy. Render terminates TLS. The edge rate limit went with it, so
#      `global_daily_call_budget` is the only cap on provider bills.
#   2. The `migrate` service. Render's pre-deploy hook needs a paid plan, so
#      `alembic upgrade head` runs on every boot via `dockerCommand`.
#   3. The `uploads` volume. A free service has no disk. That is fine only
#      because nothing reads a stored file after its upload request. Attach a
#      disk if that changes.
#
# Deploy as a Blueprint. Each `sync: false` variable is entered once in the
# dashboard, so secrets never enter the repo.

services:
  - type: web
    name: talk-to-web-api
    runtime: docker
    plan: free
    # Same region as Neon and Qdrant, since each chat turn calls both often.
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # A deploy filter: only rebuild on changes under backend/. The paths above
    # stay relative to the repo root.
    rootDir: backend

    # Liveness only, so a Neon blip cannot fail a deploy.
    healthCheckPath: /health

    # `backend/start.sh` migrates, then runs uvicorn with `--limit-concurrency`
    # (512 MB plan) and `--forwarded-allow-ips` (safe: only Render's proxy can
    # reach the port). A script, because Render does not run this through a
    # shell, so `&&` and quotes would break.
    dockerCommand: sh start.sh

    envVars:
      # Set here, since the "local" default silently skips JSON logging.
      - key: ENVIRONMENT
        value: production

      # Pairs with `--forwarded-allow-ips`. Left false, the per-IP auth limits
      # are skipped.
      - key: TRUST_FORWARDED_CLIENT_IP
        value: "true"

      # DEBUG would log every prompt and tool result.
      - key: LOG_LEVEL
        value: INFO

      # --- Postgres (Neon) -------------------------------------------------
      # DATABASE_URL is the pooled host (with `-pooler`). DATABASE_MIGRATION_URL
      # is the same host without it, since DDL needs a direct connection. Both
      # need `?sslmode=require`.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false

      # --- Qdrant Cloud ----------------------------------------------------
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: knowledge_base

      # --- Origins ---------------------------------------------------------
      # The Vercel domain, as a JSON list. API calls come through
      # `frontend/middleware.ts`, so CORS is a backstop. The WebSocket connects
      # directly, and its route checks ALLOWED_WEBSOCKET_ORIGINS (unset, it
      # copies CORS_ORIGINS).
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_WEBSOCKET_ORIGINS
        sync: false

      # --- Authentication --------------------------------------------------
      # Generated once by Render. Rotating it signs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # Cross-site cookie: needs `SameSite=None` and `Secure`. Spelled out,
      # since a mistake looks like being signed out on reload.
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none

      # --- Provider keys ---------------------------------------------------
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false

      # --- Spend ceiling ---------------------------------------------------
      # One daily counter for the whole deployment. Set explicitly.
      - key: GLOBAL_DAILY_CALL_BUDGET
        value: "200"
      # Per account, sized for a quick tester.
      - key: CHAT_RATE_LIMIT_REQUESTS
        value: "10"
      - key: UPLOAD_RATE_LIMIT_REQUESTS
        value: "5"

      # --- Tracing and error reporting --------------------------------------
      # Langfuse is off unless both keys are added in the dashboard. Not listed
      # here, so Render does not prompt for them.
      #
      # Unset SENTRY_DSN means no error reporting.
      - key: SENTRY_DSN
        sync: false

