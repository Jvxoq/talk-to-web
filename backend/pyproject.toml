[project]
name = "talk-to-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "deepgram-sdk>=7.5.0",
    "fastapi[standard]>=0.138.2",
    "google-genai>=2.10.0",
    "langchain>=1.0.0",
    "langchain-together>=0.3.0",
    "langfuse>=3.0,<4.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "sentry-sdk[fastapi]>=2.20",
    "sqlalchemy[asyncio]>=2.0.51",
    "tavily-python>=0.7.0",
    "tenacity>=9.1.4",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "import-linter>=2.1",
    "mypy>=2.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

# This is an application, not a distributable library: the code lives in `app/`,
# which does not match the project name, and nothing imports it as a package.
# Marking it non-packaged keeps `uv sync` installing dependencies only, with no
# build backend required.
[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "ASYNC",
    "S",
    "T20",
    "SIM",
    "TID",
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Fakes assert to prove their own invariants, and tests assert for a living.
# S105/S106 flag literal passwords, tokens and signing secrets - which is
# exactly what an auth test is made of. Suppressed only here: in `app/` the same
# rules are the ones that would catch a credential committed by accident.
"tests/*" = ["S101", "S105", "S106"]
# Domain errors are named for the business fact they report ("ConversationNotFound"),
# not for the fact that they are exceptions. The name is part of the ubiquitous
# language, so N818's "-Error" suffix is declined here and nowhere else.
"app/domain/*/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "deepgram.*",
    "qdrant_client.*",
    "google.*",
    "bs4.*",
    "aiofiles.*",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `uv run pytest` needs nothing running, and that stays true as the integration
# suite grows: everything under `tests/integration/` is marked (by that
# package's `pytest_collection_modifyitems`) and deselected here. Opt in with
# `uv run pytest -m integration` — a `-m` on the command line replaces this one
# rather than adding to it.
addopts = ["-m", "not integration"]
markers = [
    "integration: needs a real Postgres and Qdrant (see tests/integration/conftest.py)",
]

# `source = ["app"]` scopes coverage to the application package, so a stray
# script or a future top-level module cannot dilute the figure.
[tool.coverage.run]
source = ["app"]
branch = true

# `fail_under` lives here rather than as a `--cov-fail-under` flag in CI so a
# local run and a CI run disagree about nothing. The floor is the measured
# figure rounded down, not an aspiration: it exists to catch a regression, and
# a number nobody can hit is a number that gets deleted.
[tool.coverage.report]
show_missing = true
# Raised from 75 when the guardrail, cost and tracing work landed. Those
# modules are mostly pure functions, so they arrive near fully covered and
# leaving the gate at 75 would have let the rest of the app rot underneath a
# number the new code was quietly holding up. Set just under the measured 87%,
# which is enough headroom for an honest refactor and not enough to lose a
# whole module's tests without noticing.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "app.main",
    "app.factory",
    "app.composition",
    "app.api",
    "app.adapters",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "starlette",
    "httpx",
    "aiohttp",
]

[[tool.importlinter.contracts]]
name = "Application is infrastructure-free"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "httpx",
    "aiohttp",
    "app.adapters",
    # The agent graph lives in the application layer, so `langgraph` is allowed
    # there: it is orchestration with no network or database access, the same
    # category as `asyncio`. LangChain is the opposite - it binds real model
    # providers - so it stays behind the `ChatModel` port, in adapters. Naming
    # it here is what stops a convenient import from quietly erasing that line.
    "langchain",
    "langchain_core",
    "langchain_together",
    "tavily",
    # Cryptography is infrastructure like any other. The use cases hash and sign
    # through `PasswordHasher` / `AccessTokenCodec`, so a token format or a KDF
    # can be replaced without a business rule noticing - and, more to the point,
    # so a convenient `import jwt` in a use case cannot quietly weld one in.
    "jwt",
    "argon2",
]

[[tool.importlinter.contracts]]
name = "Settings enter only at the composition root"
type = "forbidden"
source_modules = [
    "app.domain",
    "app.application",
    "app.adapters",
    "app.api",
]
forbidden_modules = ["app.settings"]

[[tool.importlinter.contracts]]
name = "API never touches adapters"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.adapters"]
