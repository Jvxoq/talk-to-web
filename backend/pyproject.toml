[project]
name = "talk-to-the-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "deepgram-sdk>=7.5.0",
    "fastapi[standard]>=0.138.2",
    "google-genai>=2.10.0",
    # No direct `groq` pin: nothing imports the vendor SDK any more, and
    # langchain-groq requires groq<1.0.0, which a direct pin would contradict.
    "langchain>=1.0.0",
    "langchain-groq>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.7.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "tavily-python>=0.7.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.1",
    "mypy>=2.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

# This is an application, not a distributable library: the code lives in `app/`,
# which does not match the project name, and nothing imports it as a package.
# Marking it non-packaged keeps `uv sync` installing dependencies only, with no
# build backend required.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "alembic",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "ASYNC",
    "S",
    "T20",
    "SIM",
    "TID",
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Fakes assert to prove their own invariants, and tests assert for a living.
"tests/*" = ["S101"]
# Domain errors are named for the business fact they report ("ConversationNotFound"),
# not for the fact that they are exceptions. The name is part of the ubiquitous
# language, so N818's "-Error" suffix is declined here and nowhere else.
"app/domain/*/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "deepgram.*",
    "qdrant_client.*",
    "google.*",
    "bs4.*",
    "aiofiles.*",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "app.main",
    "app.composition",
    "app.api",
    "app.adapters",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "starlette",
    "httpx",
    "aiohttp",
]

[[tool.importlinter.contracts]]
name = "Application is infrastructure-free"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "httpx",
    "aiohttp",
    "app.adapters",
    # The agent graph lives in the application layer, so `langgraph` is allowed
    # there: it is orchestration with no network or database access, the same
    # category as `asyncio`. LangChain is the opposite - it binds real model
    # providers - so it stays behind the `ChatModel` port, in adapters. Naming
    # it here is what stops a convenient import from quietly erasing that line.
    "langchain",
    "langchain_core",
    "langchain_groq",
    "tavily",
]

[[tool.importlinter.contracts]]
name = "Settings enter only at the composition root"
type = "forbidden"
source_modules = [
    "app.domain",
    "app.application",
    "app.adapters",
    "app.api",
]
forbidden_modules = ["app.settings"]

[[tool.importlinter.contracts]]
name = "API never touches adapters"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.adapters"]
