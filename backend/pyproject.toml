[project]
name = "talk-to-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "deepgram-sdk>=7.5.0",
    "fastapi[standard]>=0.138.2",
    "google-genai>=2.10.0",
    "langchain>=1.0.0",
    "langchain-together>=0.3.0",
    "langfuse>=3.0,<4.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "sentry-sdk[fastapi]>=2.20",
    "sqlalchemy[asyncio]>=2.0.51",
    "tavily-python>=0.7.0",
    "tenacity>=9.1.4",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "import-linter>=2.1",
    "mypy>=2.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.4.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

# An application, not a library, so `uv sync` installs dependencies only.
[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "BLE",
    "A",
    "C4",
    "ASYNC",
    "S",
    "T20",
    "SIM",
    "TID",
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and fake secrets (S105/S106). These rules still apply in `app/`.
"tests/*" = ["S101", "S105", "S106"]
# Domain errors are named for the business fact, without an "Error" suffix.
"app/domain/*/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "deepgram.*",
    "qdrant_client.*",
    "google.*",
    "bs4.*",
    "aiofiles.*",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test fails instead of hanging CI. Needs `pytest-timeout`.
timeout = 30
filterwarnings = [
    "error",
    # Raised by Starlette when `fastapi.testclient` loads, not by our code.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # Local-mode Qdrant accepts payload indexes but ignores them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
# Integration tests are deselected, so `uv run pytest` needs nothing running.
# Opt in with `uv run pytest -m integration`.
addopts = ["-m", "not integration"]
markers = [
    "integration: needs a real Postgres and Qdrant (see tests/integration/conftest.py)",
]

# Coverage for the `app` package only.
[tool.coverage.run]
source = ["app"]
branch = true

# Kept here, not as a CI flag, so local runs and CI agree.
[tool.coverage.report]
show_missing = true
# Just under the measured 87%, to catch a regression without blocking refactors.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
    "app.main",
    "app.factory",
    "app.composition",
    "app.api",
    "app.adapters",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "starlette",
    "httpx",
    "aiohttp",
]

[[tool.importlinter.contracts]]
name = "Application is infrastructure-free"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "httpx",
    "aiohttp",
    "app.adapters",
    # `langgraph` is allowed in the application layer: orchestration with no
    # network or database access. LangChain binds real providers, so it stays in
    # adapters.
    "langchain",
    "langchain_core",
    "langchain_together",
    "tavily",
    # Crypto stays behind `PasswordHasher` and `AccessTokenCodec`.
    "jwt",
    "argon2",
]

[[tool.importlinter.contracts]]
name = "Settings enter only at the composition root"
type = "forbidden"
source_modules = [
    "app.domain",
    "app.application",
    "app.adapters",
    "app.api",
]
forbidden_modules = ["app.settings"]

[[tool.importlinter.contracts]]
name = "API never touches adapters"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.adapters"]
