# Local copy of the fast CI checks: no database, vector store or API key.
# mypy, lint-imports, pytest and frontend builds stay in CI.
#
#   uv run pre-commit install     # from backend/, once per clone
#   uv run pre-commit run --all-files
#
# Build output and caches, excluded once here for every hook.
exclude: '(^|/)(dist|node_modules|\.venv|\.mypy_cache|\.ruff_cache|\.pytest_cache|\.import_linter_cache|uploads)/|\.tsbuildinfo$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # These files hold `//` comments (JSONC), which this hook would flag.
        exclude: '(^|/)(\.vscode/.*\.json|tsconfig.*\.json)$'
      # Blocks commits that contain a private key.
      - id: detect-private-key

  # Same version as `backend/pyproject.toml` and `uv.lock`, so hook and CI agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format
        files: ^backend/
      - id: ruff
        files: ^backend/
        args: ["--fix"]

  # oxlint has no pre-commit mirror, and is fast enough to run directly.
  # `--prefix` works from any directory.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (frontend)
        entry: npm run lint --prefix frontend --
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
