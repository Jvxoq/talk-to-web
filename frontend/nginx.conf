# Serves the built SPA and proxies the API next to it, so both are one origin.
#
# This is the local parity harness (`docker-compose.prod.yml --profile parity`),
# not the real deployment - there, Vercel serves these files and rewrites the API
# paths to Caddy. The two have to agree on which paths are API paths, so this
# `location` list and the `rewrites` in `vercel.json` are the same list twice.
# Adding a route to one without the other is how a call starts returning
# index.html with a 200.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sign in, sign up, refresh and sign out. Proxied alongside the rest so the
    # refresh cookie is first-party: the browser sees one origin, and a cookie
    # scoped to this host is sent back on every /auth/ call without needing
    # SameSite=None.
    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /generate/ {
        proxy_pass http://backend:8000/generate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # This endpoint streams SSE. nginx buffers proxied responses by default,
        # which holds every token until the response completes and then delivers
        # the whole answer at once - the stream still "works", it just stops
        # being a stream, which is the entire user-visible feature.
        proxy_buffering off;
        proxy_cache off;
        # Chunked transfer needs HTTP/1.1; the default 1.0 upstream would
        # buffer to compute a Content-Length regardless of the setting above.
        proxy_http_version 1.1;
        # An agent that calls a tool or two can think for a while before the
        # first token. The default 60s would cut those replies off.
        proxy_read_timeout 300s;
    }

    location /upload/ {
        proxy_pass http://backend:8000/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Matches MAX_UPLOAD_BYTES (25 MiB). nginx's 1m default rejects a normal
        # PDF with a 413 before the application ever sees it.
        client_max_body_size 30m;
    }

    # Removing an attachment: the close button on the chip deletes the document
    # it names, so the same list has to carry this route too.
    location /documents/ {
        proxy_pass http://backend:8000/documents/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Conversation history: created on first message, read on reload, deleted by
    # the unload beacon. Missing from this file, every one of those calls was
    # answered by `try_files` with index.html and a 200.
    location /conversations/ {
        proxy_pass http://backend:8000/conversations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The model list. Its failure mode was the quiet one: the fetch succeeded,
    # the JSON parse failed, and the composer fell back to hardcoded models that
    # the backend may not even accept.
    location /models/ {
        proxy_pass http://backend:8000/models/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket endpoint for live speech-to-text. Unlike the routes above this
    # needs the Upgrade headers, otherwise nginx downgrades it to plain HTTP.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Origin is forwarded untouched, which the backend requires: it checks
        # the handshake's origin against ALLOWED_WEBSOCKET_ORIGINS, so that list
        # must contain the address this nginx is reached on.
        proxy_set_header Origin $http_origin;
        # Audio sessions idle between utterances; don't cut them off.
        proxy_read_timeout 3600s;
    }
}
