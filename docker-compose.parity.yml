# Points the `parity` profile at safe stand-ins for the managed services
# instead of real production: a Neon dev branch for Postgres, and a separate
# dev collection on the same Qdrant Cloud cluster for vectors. Combine with
# `docker-compose.prod.yml`:
#
#   cp backend/.env.parity.example backend/.env.parity   # then fill it in
#   docker compose -f docker-compose.prod.yml -f docker-compose.parity.yml \
#     --profile parity up --build
#
# `env_file` lists append across `-f` files rather than being replaced, so
# `backend/.env.parity` only needs to carry what differs from
# `backend/.env.production` — Postgres and Qdrant. Everything else (JWT_SECRET,
# provider keys, ENVIRONMENT) still comes from `.env.production` unchanged.
#
# This file adds no `qdrant` service and no `environment:` override — a
# top-level `environment:` entry always wins over `env_file` for the same key,
# which is exactly what would silently force Qdrant back onto a local
# container regardless of what `backend/.env.parity` says. Every value here
# flows straight from that one file instead, including QDRANT_URL, so a real
# Qdrant Cloud cluster is reachable — just a dev collection on it, never the
# production one.

services:
  migrate:
    env_file:
      - ./backend/.env.parity

  backend:
    env_file:
      - ./backend/.env.parity
