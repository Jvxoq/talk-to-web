# Points the `parity` profile at safe stand-ins for the managed services
# instead of real production: a Neon dev branch for Postgres, and a throwaway
# local Qdrant container - not Qdrant Cloud, so a parity run can never read or
# write real production vectors. Combine with `docker-compose.prod.yml`:
#
#   cp backend/.env.parity.example backend/.env.parity   # then fill it in
#   docker compose -f docker-compose.prod.yml -f docker-compose.parity.yml \
#     --profile parity up --build
#
# `env_file` lists append across `-f` files rather than being replaced, so
# `backend/.env.parity` only needs to carry Postgres, which is why the
# Postgres override below is `env_file` but the Qdrant override is
# `environment` instead: a top-level `environment:` entry always wins over
# whatever `env_file` set for the same key, which is what actually keeps
# QDRANT_URL/QDRANT_API_KEY from `.env.production` off this run - listing
# QDRANT_COLLECTION in `.env.parity` would not have been enough on its own.

services:
  qdrant:
    profiles: ["parity"]
    image: qdrant/qdrant:latest
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  migrate:
    env_file:
      - ./backend/.env.parity

  backend:
    env_file:
      - ./backend/.env.parity
    environment:
      QDRANT_URL: http://qdrant:6333
      # No value: passes through the host shell's QDRANT_API_KEY if it has one
      # (it won't), otherwise leaves the var unset in the container - clearing
      # the real key `.env.production` set, rather than sending Qdrant Cloud's
      # key to a local instance as an empty string.
      QDRANT_API_KEY:
    depends_on:
      qdrant:
        condition: service_healthy
